<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zaheen Khan</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    a-scene, .a-canvas, canvas {
      background: transparent !important;
    }

    #guide {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(72vw, 380px);
      aspect-ratio: 89 / 51;
      border: 3px dashed #ffffff;
      border-radius: 10px;
      pointer-events: none;
      z-index: 5;
    }

    #guideText {
      position: fixed;
      top: 18%;
      left: 0;
      right: 0;
      text-align: center;
      font-family: Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      z-index: 6;
    }

    /* Everything that shows while the card is tracked */
    #overlay {
      position: fixed;
      bottom: 8%;
      left: 0;
      right: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 20;
    }

    #credit {
      font-family: Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.55);
      padding: 8px 16px;
      border-radius: 999px;
      pointer-events: none;
      white-space: nowrap;
    }

    /* A real link, so the tap counts as a genuine gesture and is never blocked */
    #portfolioBtn {
      font-family: Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: #000;
      background: #ffffff;
      padding: 15px 24px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      text-decoration: none;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    #portfolioBtn:active {
      background: #e6e6e6;
    }
  </style>
</head>
<body>

<div id="guideText">Point your camera at the card</div>
<div id="guide"></div>

<div id="overlay">
  <div id="credit">Built by Zaheen Khan, in Unreal Engine 5</div>
  <a id="portfolioBtn" href="https://zaheenkhanportfolio.framer.website" target="_blank" rel="noopener">
    Tap to see the portfolio
  </a>
</div>

<a-scene mindar-image="imageTargetSrc: ./zaheen-card.mind; autoStart: true; uiLoading: no; uiError: no"
         color-space="sRGB"
         renderer="colorManagement: true; alpha: true; antialias: true"
         vr-mode-ui="enabled: false"
         device-orientation-permission-ui="enabled: false"
         cursor="rayOrigin: mouse"
         raycaster="objects: .clickable">

  <a-assets>
    <video id="showreel" src="showreel.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="card" mindar-image-target="targetIndex: 0">
    <a-video class="clickable"
             src="#showreel"
             width="1"
             height="0.573"
             position="0 0 0.01">
    </a-video>
  </a-entity>
</a-scene>

<script>
  const PORTFOLIO = 'https://zaheenkhanportfolio.framer.website';

  const card = document.querySelector('#card');
  const video = document.querySelector('#showreel');
  const guide = document.getElementById('guide');
  const guideText = document.getElementById('guideText');
  const overlay = document.getElementById('overlay');
  const btn = document.getElementById('portfolioBtn');
  const clickable = document.querySelector('.clickable');

  let cardVisible = false;

  card.addEventListener('targetFound', () => {
    cardVisible = true;
    video.play();
    overlay.style.display = 'flex';
    guide.style.display = 'none';
    guideText.style.display = 'none';
  });

  card.addEventListener('targetLost', () => {
    cardVisible = false;
    video.pause();
    overlay.style.display = 'none';
    guide.style.display = 'block';
    guideText.style.display = 'block';
  });

  // Tapping the video goes to the portfolio.
  // location.href is used instead of window.open, which phones block here.
  clickable.addEventListener('click', () => {
    window.location.href = PORTFOLIO;
  });

  // If autoplay was blocked, a tap anywhere while the card is visible starts the video.
  document.body.addEventListener('touchstart', (e) => {
    if (e.target.closest('#portfolioBtn')) return;
    if (video.paused && cardVisible) video.play();
  }, { passive: true });
</script>

</body>
</html>
